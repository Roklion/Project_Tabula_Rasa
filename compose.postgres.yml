name: tabula-rasa-postgres
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: tabula_dev
      POSTGRES_DB: tabula_dev
      # Disposable local development only; never expose this outside loopback.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${TABULA_RASA_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabula_dev -d tabula_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
