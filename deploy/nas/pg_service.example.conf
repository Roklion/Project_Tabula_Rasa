# Private deployment file. One selected database per config/service/password set.
[backup]
host=REPLACE_WITH_DIRECT_UNPOOLED_HOST
port=5432
dbname=REPLACE_WITH_DATABASE
user=REPLACE_WITH_BACKUP_ROLE
sslmode=verify-full
sslrootcert=/etc/ssl/certs/ca-certificates.crt
channel_binding=require
connect_timeout=15
