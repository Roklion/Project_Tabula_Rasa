name: Inspect or run one synthetic staging job probe
on:
  workflow_dispatch:
    inputs:
      image:
        description: Tested immutable image from this exact main revision, already deployed to staging
        type: string
        required: true
      operation:
        type: choice
        options: [inspect, probe]
        default: inspect
        required: true
      approval:
        description: Probe requires exact synthetic target approval and no competing job operators
        type: choice
        options: [not_approved, one_probe_no_other_job_operators]
        default: not_approved
        required: true
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  staging-probe:
    if: github.ref == 'refs/heads/main' && vars.COMMERCIAL_DEPLOY_ENABLED == 'true'
    environment: staging
    concurrency:
      group: commercial-deploy-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: ${{ inputs.image }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TABULA_RASA_ENVIRONMENT: staging
      TABULA_RASA_RELEASE_ID: ${{ github.sha }}
      TABULA_RASA_ACCESS_MODE: ${{ vars.TABULA_RASA_ACCESS_MODE }}
      TABULA_RASA_PUBLIC_ORIGIN: ${{ vars.TABULA_RASA_PUBLIC_ORIGIN }}
      TABULA_RASA_DEPLOY_DATABASE_SHA256: ${{ vars.TABULA_RASA_DEPLOY_DATABASE_SHA256 }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      STAGING_JOB_PROBE_ENTITY_ID: ${{ vars.STAGING_JOB_PROBE_ENTITY_ID }}
      JOB_PROBE_OPERATION: ${{ inputs.operation }}
      JOB_PROBE_APPROVAL: ${{ inputs.approval }}
      TABULA_RASA_DATABASE_POOL_SIZE: '1'
      TABULA_RASA_DATABASE_MAX_OVERFLOW: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-postgres.txt requests==2.34.2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify tested main image
        run: python -m tabula_rasa.deployment.staging_job_probe preflight
      - name: Inspect or execute one approved ledger-read probe
        env:
          TABULA_RASA_DATABASE_URL: ${{ secrets.TABULA_RASA_RUNTIME_DATABASE_URL }}
          TABULA_RASA_TELEMETRY_ENDPOINT: ${{ secrets.TABULA_RASA_TELEMETRY_ENDPOINT }}
          TABULA_RASA_TELEMETRY_TOKEN: ${{ secrets.TABULA_RASA_TELEMETRY_TOKEN }}
          TABULA_RASA_TELEMETRY_SCOPE_KEY: ${{ secrets.TABULA_RASA_TELEMETRY_SCOPE_KEY }}
        run: python -m tabula_rasa.deployment.staging_job_probe execute >> "$GITHUB_STEP_SUMMARY"
