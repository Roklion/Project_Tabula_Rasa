name: Promote commercial staging
on:
  workflow_dispatch:
    inputs:
      image:
        description: Tested GHCR commercial image with immutable sha256 digest
        required: true
        type: string
      rollback_from:
        description: For intentional rollback only, the full commit SHA currently live on staging
        required: false
        type: string
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  staging:
    if: github.ref == 'refs/heads/main' && vars.COMMERCIAL_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/commercial-promote.yml
    with:
      environment: staging
      image: ${{ inputs.image }}
      rollback_from: ${{ inputs.rollback_from }}
    secrets: inherit
