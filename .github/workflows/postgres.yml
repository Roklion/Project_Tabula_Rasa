name: PostgreSQL foundation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: tabula_test
          POSTGRES_DB: tabula_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tabula_test -d tabula_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TABULA_TEST_DATABASE_URL: postgresql+psycopg://tabula_test@127.0.0.1:5432/tabula_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest tests/postgres tests/test_application_boundaries.py tests/test_app_composition.py
