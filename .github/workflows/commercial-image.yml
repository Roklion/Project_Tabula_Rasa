name: Commercial release image
on:
  workflow_run:
    workflows: [Repository CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.release.outputs.repository }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-postgres.txt
      - id: release
        shell: bash
        env:
          RELEASE_ID: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}/commercial" >> "$GITHUB_OUTPUT"
          echo "schema=$(python -c 'from tabula_rasa.infrastructure.postgres.migrations import head_revision; print(head_revision())')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/commercial/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.repository }}:${{ github.event.workflow_run.head_sha }}
          build-args: |
            RELEASE_ID=${{ github.event.workflow_run.head_sha }}
            SCHEMA_REVISION=${{ steps.release.outputs.schema }}
      - name: Record immutable release
        env:
          IMAGE: ${{ steps.release.outputs.repository }}@${{ steps.build.outputs.digest }}
          RELEASE: ${{ github.event.workflow_run.head_sha }}
          SCHEMA: ${{ steps.release.outputs.schema }}
        run: |
          echo "Release: $RELEASE" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "Schema: $SCHEMA" >> "$GITHUB_STEP_SUMMARY"
  development:
    needs: build
    if: vars.COMMERCIAL_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      actions: read
      packages: read
    uses: ./.github/workflows/commercial-promote.yml
    with:
      environment: development
      image: ${{ needs.build.outputs.image }}
    secrets: inherit
