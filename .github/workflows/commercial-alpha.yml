name: Technical alpha staging gate
on:
  workflow_dispatch:
    inputs:
      release:
        description: Exact 40-character SHA of the deployed CI-approved main release
        required: true
        type: string
      allow_synthetic_writes:
        description: Authorize the bounded synthetic staging journey and its own-record removals
        required: true
        default: false
        type: boolean
jobs:
  alpha:
    if: github.ref == 'refs/heads/main' && vars.COMMERCIAL_DEPLOY_ENABLED == 'true' && inputs.allow_synthetic_writes
    permissions:
      contents: read
      actions: read
    environment: staging
    concurrency:
      group: commercial-deploy-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TABULA_RASA_ENVIRONMENT: staging
      TABULA_RASA_PUBLIC_ORIGIN: ${{ vars.TABULA_RASA_PUBLIC_ORIGIN }}
      RELEASE: ${{ inputs.release }}
    steps:
      - name: Verify restricted-alpha access mode before release checkout
        env:
          TABULA_RASA_ACCESS_MODE: ${{ vars.TABULA_RASA_ACCESS_MODE }}
        run: test "$TABULA_RASA_ACCESS_MODE" = restricted_alpha
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify current main-release CI evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c 'import os,re; from tabula_rasa.deployment.release import validated_main; release=os.environ["RELEASE"]; assert re.fullmatch("[0-9a-f]{40}", release); validated_main(release, dict(os.environ))'
      - name: Check out validated release
        run: |
          git checkout --detach "$RELEASE"
          test "$(git rev-parse HEAD)" = "$RELEASE"
      - name: Install bounded release browser suite
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Verify core synthetic alpha journeys on retained staging
        env:
          TABULA_RASA_ACCESS_MODE: ${{ vars.TABULA_RASA_ACCESS_MODE }}
          TABULA_RASA_ALPHA_USERNAME: ${{ secrets.TABULA_RASA_ALPHA_USERNAME }}
          TABULA_RASA_ALPHA_PASSWORD: ${{ secrets.TABULA_RASA_ALPHA_PASSWORD }}
        run: python -m tabula_rasa.deployment.alpha --release "$RELEASE" --allow-synthetic-writes >> "$GITHUB_STEP_SUMMARY"
