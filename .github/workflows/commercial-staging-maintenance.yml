name: Staging 0012 to 0014 maintenance
on:
  workflow_dispatch:
    inputs:
      approval:
        description: Reviewed maintenance approval; staging must already be suspended
        type: choice
        required: true
        default: not_approved
        options: [not_approved, 0012_to_0014]
      recovery_checkpoint_sha256:
        description: SHA-256 of the privately verified pre-upgrade staging recovery record
        type: string
        required: true
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && inputs.approval == '0012_to_0014' && vars.COMMERCIAL_DEPLOY_ENABLED == 'true'
    environment: staging
    concurrency:
      group: commercial-deploy-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/roklion/project_tabula_rasa/commercial@sha256:4bb275f4dc8475bc08ee45d32b3648d4fc33f03c823e3cf3a0c001a9a9bf0c3d
      TABULA_RASA_ENVIRONMENT: staging
      TABULA_RASA_ACCESS_MODE: ${{ vars.TABULA_RASA_ACCESS_MODE }}
      TABULA_RASA_PUBLIC_ORIGIN: ${{ vars.TABULA_RASA_PUBLIC_ORIGIN }}
      TABULA_RASA_DEPLOY_DATABASE_SHA256: ${{ vars.TABULA_RASA_DEPLOY_DATABASE_SHA256 }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      MAINTENANCE_APPROVAL: ${{ inputs.approval }}
      MAINTENANCE_RECOVERY_SHA256: ${{ inputs.recovery_checkpoint_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-postgres.txt
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify tested immutable image and suspended staging service
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python -m tabula_rasa.deployment.staging_maintenance preflight >> "$GITHUB_STEP_SUMMARY"
      - name: Bound forward upgrade in the exact candidate image
        env:
          TABULA_RASA_DATABASE_URL: ${{ secrets.TABULA_RASA_MIGRATION_DATABASE_URL }}
        run: |
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            -e PYTHONPATH=/app -e GITHUB_REPOSITORY -e IMAGE \
            -e TABULA_RASA_ENVIRONMENT -e TABULA_RASA_ACCESS_MODE \
            -e TABULA_RASA_PUBLIC_ORIGIN -e TABULA_RASA_DEPLOY_DATABASE_SHA256 \
            -e RENDER_SERVICE_ID -e MAINTENANCE_APPROVAL -e MAINTENANCE_RECOVERY_SHA256 \
            -e TABULA_RASA_DATABASE_URL \
            --mount "type=bind,source=$GITHUB_WORKSPACE/tabula_rasa/deployment/staging_maintenance.py,target=/maintenance/run.py,readonly" \
            --entrypoint python "$IMAGE" /maintenance/run.py upgrade >> "$GITHUB_STEP_SUMMARY"
