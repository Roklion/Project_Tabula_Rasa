name: Controlled CI evidence 376
'on':
  push:
    branches:
    - codex/issue-376-ci-evidence
permissions:
  contents: read
concurrency:
  group: ci-evidence-376-${{ github.ref }}
  cancel-in-progress: false
env:
  EVIDENCE_SOURCE_SHA: 84f427e1ec0f9bb38baf63b7b4c6a6b0bb98f6db
  EVIDENCE_SAMPLE: '1'
jobs:
  partitioned-python-suite:
    name: Partitioned | Python suite (Linux + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: tabula_test
          POSTGRES_DB: tabula_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U tabula_test -d tabula_test" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TABULA_RASA_TEST_DATABASE_URL: postgresql+psycopg://tabula_test@127.0.0.1:5432/tabula_test
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 84f427e1ec0f9bb38baf63b7b4c6a6b0bb98f6db
    - name: Verify fixed source and record runtime
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "$EVIDENCE_SOURCE_SHA"

        python --version 2>/dev/null || true

        node --version 2>/dev/null || true

        printf ''source=%s sample=%s workflow=%s run=%s attempt=%s

        '' "$EVIDENCE_SOURCE_SHA" "$EVIDENCE_SAMPLE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

        '
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Install development dependencies
      run: python -m pip install -r requirements-dev.txt
    - name: Build NAS backup client image
      run: docker build -f deploy/nas/Dockerfile -t tabula-nas-backup:test .
    - name: Verify synthetic NAS TLS backup and isolated restore
      run: docker run --rm --user postgres --entrypoint python3 --mount type=bind,source=${{ github.workspace }}/tests/tooling/nas_backup_smoke.py,target=/smoke.py,readonly tabula-nas-backup:test /smoke.py
    - name: Lint Python
      run: ruff check .
    - name: Run complete Python suite
      run: python -m pytest -ra --durations=20 --junitxml=python-results.xml
    - name: Upload Python results
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: partitioned-python-results
        path: python-results.xml
        if-no-files-found: ignore
  partitioned-windows-tooling:
    name: Partitioned | Windows environment setup
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 84f427e1ec0f9bb38baf63b7b4c6a6b0bb98f6db
    - name: Verify fixed source and record runtime
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "$EVIDENCE_SOURCE_SHA"

        python --version 2>/dev/null || true

        node --version 2>/dev/null || true

        printf ''source=%s sample=%s workflow=%s run=%s attempt=%s

        '' "$EVIDENCE_SOURCE_SHA" "$EVIDENCE_SAMPLE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

        '
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Install development dependencies
      run: python -m pip install -r requirements-dev.txt
    - name: Run Windows-only setup coverage
      run: python -m pytest tests/tooling/test_codex_environment_setup.py -ra --junitxml=windows-results.xml
    - name: Upload Windows results
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: partitioned-windows-results
        path: windows-results.xml
        if-no-files-found: ignore
  partitioned-frontend-contract:
    name: Partitioned | Frontend, contracts and runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 84f427e1ec0f9bb38baf63b7b4c6a6b0bb98f6db
    - name: Verify fixed source and record runtime
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "$EVIDENCE_SOURCE_SHA"

        python --version 2>/dev/null || true

        node --version 2>/dev/null || true

        printf ''source=%s sample=%s workflow=%s run=%s attempt=%s

        '' "$EVIDENCE_SOURCE_SHA" "$EVIDENCE_SAMPLE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

        '
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Install development dependencies
      run: python -m pip install -r requirements-dev.txt
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: web/package-lock.json
    - run: npm --prefix web ci
    - run: python -m tabula_rasa.http.export_openapi --output contracts/http/openapi.json
    - run: npm --prefix web run api:generate
    - run: git diff --exit-code -- contracts/http/openapi.json web/src/api/schema.d.ts
    - run: npm --prefix web run build
    - run: npm --prefix web run lint
    - run: npm --prefix web test
    - run: npm --prefix web run test:contracts
    - name: Build and inspect commercial runtime image (no runtime secrets)
      shell: bash
      run: 'SCHEMA=$(python -c ''from tabula_rasa.infrastructure.postgres.migrations import head_revision; print(head_revision())'')

        docker build --platform linux/amd64 --build-arg RELEASE_ID="$EVIDENCE_SOURCE_SHA" --build-arg SCHEMA_REVISION="$SCHEMA" -f deploy/commercial/Dockerfile -t tabula-commercial:ci .

        docker run --rm tabula-commercial:ci python -c ''import sys; from tabula_rasa.http.app import create_app; from tabula_rasa.http.alpha_documents import load_alpha_document_store; create_app(schema_only=True).openapi(); assert not {"streamlit", "gspread", "tabula_rasa.storage"}.intersection(sys.modules)''

        '
    - name: Upload run-once contract results
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: partitioned-frontend-contract-results
        path: web/test-results/contracts/
        if-no-files-found: ignore
  partitioned-browser:
    name: Partitioned | Browser UI (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 84f427e1ec0f9bb38baf63b7b4c6a6b0bb98f6db
    - name: Verify fixed source and record runtime
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "$EVIDENCE_SOURCE_SHA"

        python --version 2>/dev/null || true

        node --version 2>/dev/null || true

        printf ''source=%s sample=%s workflow=%s run=%s attempt=%s

        '' "$EVIDENCE_SOURCE_SHA" "$EVIDENCE_SAMPLE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

        '
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: web/package-lock.json
    - run: npm --prefix web ci
    - run: npm --prefix web exec -- playwright install --with-deps chromium firefox webkit
    - run: npm --prefix web run test:browser -- --shard=${{ matrix.shard }}/2
    - name: Upload browser UI results
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: partitioned-browser-ui-${{ matrix.shard }}
        path: web/test-results/browser/
        if-no-files-found: ignore
  partitioned-native-browser:
    name: Partitioned | Native browser (HTTP + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: tabula_test
          POSTGRES_DB: tabula_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U tabula_test -d tabula_test" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TABULA_RASA_TEST_DATABASE_URL: postgresql+psycopg://tabula_test@127.0.0.1:5432/tabula_test
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 84f427e1ec0f9bb38baf63b7b4c6a6b0bb98f6db
    - name: Verify fixed source and record runtime
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "$EVIDENCE_SOURCE_SHA"

        python --version 2>/dev/null || true

        node --version 2>/dev/null || true

        printf ''source=%s sample=%s workflow=%s run=%s attempt=%s

        '' "$EVIDENCE_SOURCE_SHA" "$EVIDENCE_SAMPLE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

        '
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Install development dependencies
      run: python -m pip install -r requirements-dev.txt
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: web/package-lock.json
    - run: npm --prefix web ci
    - run: npm --prefix web run build
    - run: python -m playwright install --with-deps chromium firefox webkit
    - name: Run native browser concurrency and core workflow tests
      run: python -m pytest tests/postgres/test_browser_alpha.py tests/postgres/test_browser_baselines.py tests/postgres/test_browser_copy_recurring.py tests/postgres/test_browser_mileage_documents.py tests/postgres/test_browser_mileage_imports.py tests/postgres/test_browser_quality.py tests/postgres/test_browser_secondary.py tests/postgres/test_browser_transaction_bulk_copy.py tests/postgres/test_browser_transaction_imports.py tests/postgres/test_browser_workflow_ports.py tests/postgres/test_browser_workflows.py tests/postgres/test_identity_browser.py tests/postgres/test_workspace_browser.py -ra --durations=20 --junitxml=native-browser-results.xml
      env:
        TABULA_RASA_REQUIRE_BROWSER_TESTS: '1'
    - name: Upload native browser results
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: partitioned-native-browser-results
        path: 'native-browser-results.xml

          web/test-results/

          '
        if-no-files-found: ignore
  baseline-python-suite:
    name: Baseline | Python suite (Linux + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: tabula_test
          POSTGRES_DB: tabula_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U tabula_test -d tabula_test" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TABULA_RASA_TEST_DATABASE_URL: postgresql+psycopg://tabula_test@127.0.0.1:5432/tabula_test
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 84f427e1ec0f9bb38baf63b7b4c6a6b0bb98f6db
    - name: Verify fixed source and record runtime
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "$EVIDENCE_SOURCE_SHA"

        python --version 2>/dev/null || true

        node --version 2>/dev/null || true

        printf ''source=%s sample=%s workflow=%s run=%s attempt=%s

        '' "$EVIDENCE_SOURCE_SHA" "$EVIDENCE_SAMPLE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

        '
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Install development dependencies
      run: python -m pip install -r requirements-dev.txt
    - name: Build NAS backup client image
      run: docker build -f deploy/nas/Dockerfile -t tabula-nas-backup:test .
    - name: Verify synthetic NAS TLS backup and isolated restore
      run: docker run --rm --user postgres --entrypoint python3 --mount type=bind,source=${{ github.workspace }}/tests/tooling/nas_backup_smoke.py,target=/smoke.py,readonly tabula-nas-backup:test /smoke.py
    - name: Lint Python
      run: ruff check .
    - name: Run complete Python suite
      run: python -m pytest -ra --durations=20 --junitxml=python-results.xml
    - name: Upload Python results
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: baseline-python-results
        path: python-results.xml
        if-no-files-found: ignore
  baseline-windows-tooling:
    name: Baseline | Windows environment setup
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 84f427e1ec0f9bb38baf63b7b4c6a6b0bb98f6db
    - name: Verify fixed source and record runtime
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "$EVIDENCE_SOURCE_SHA"

        python --version 2>/dev/null || true

        node --version 2>/dev/null || true

        printf ''source=%s sample=%s workflow=%s run=%s attempt=%s

        '' "$EVIDENCE_SOURCE_SHA" "$EVIDENCE_SAMPLE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

        '
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Install development dependencies
      run: python -m pip install -r requirements-dev.txt
    - name: Run Windows-only setup coverage
      run: python -m pytest tests/tooling/test_codex_environment_setup.py -ra --junitxml=windows-results.xml
    - name: Upload Windows results
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: baseline-windows-results
        path: windows-results.xml
        if-no-files-found: ignore
  baseline-combined:
    name: Baseline | Combined frontend, UI and native browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 84f427e1ec0f9bb38baf63b7b4c6a6b0bb98f6db
    - name: Verify fixed source and record runtime
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "$EVIDENCE_SOURCE_SHA"

        python --version 2>/dev/null || true

        node --version 2>/dev/null || true

        printf ''source=%s sample=%s workflow=%s run=%s attempt=%s

        '' "$EVIDENCE_SOURCE_SHA" "$EVIDENCE_SAMPLE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

        '
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Install development dependencies
      run: python -m pip install -r requirements-dev.txt
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: web/package-lock.json
    - run: npm --prefix web ci
    - run: python -m tabula_rasa.http.export_openapi --output contracts/http/openapi.json
    - run: npm --prefix web run api:generate
    - run: git diff --exit-code -- contracts/http/openapi.json web/src/api/schema.d.ts
    - run: npm --prefix web run build
    - run: npm --prefix web run lint
    - run: npm --prefix web test
    - name: Restore pre-partition execution ownership
      shell: bash
      run: "python - <<'PY'\nfrom pathlib import Path\nimport hashlib, json, re\ncontracts = Path('web/contracts/visual-review.spec.ts').read_text()\nui_path = Path('web/e2e/visual-review.spec.ts')\nui = ui_path.read_text()\nmarker = \"test('\"\nheader, contract_body = contracts.split(marker, 1)\ncontract_body = marker + contract_body\nui_body = marker + ui.split(marker, 1)[1]\nassert len(re.findall(r\"^test\\('\", contract_body, re.M)) == 5\nassert len(re.findall(r\"^test\\('\", ui_body, re.M)) == 2\ncomposed = header.replace('../e2e/', './') + contract_body + '\\n' + ui_body\nassert contract_body in composed and ui_body in composed\nui_path.write_text(composed)\nproof = {'source_sha': '84f427e1ec0f9bb38baf63b7b4c6a6b0bb98f6db',\n         'contract_body_sha256': hashlib.sha256(contract_body.encode()).hexdigest(),\n         'ui_body_sha256': hashlib.sha256(ui_body.encode()).hexdigest(),\n         'contract_tests': 5, 'page_tests': 2,\n         'treatment': 'unchanged five contract bodies\
        \ restored to four UI projects'}\nPath('baseline-overlay-proof.json').write_text(json.dumps(proof, indent=2))\nprint(json.dumps(proof))\nPY\n"
    - name: Install Node browser engines
      run: npm --prefix web exec -- playwright install --with-deps chromium firefox webkit
    - name: Run unsharded UI and repeated contracts
      run: npm --prefix web run test:browser
    - name: Build and inspect commercial runtime image (no runtime secrets)
      shell: bash
      run: 'SCHEMA=$(python -c ''from tabula_rasa.infrastructure.postgres.migrations import head_revision; print(head_revision())'')

        docker build --platform linux/amd64 --build-arg RELEASE_ID="$EVIDENCE_SOURCE_SHA" --build-arg SCHEMA_REVISION="$SCHEMA" -f deploy/commercial/Dockerfile -t tabula-commercial:ci .

        docker run --rm tabula-commercial:ci python -c ''import sys; from tabula_rasa.http.app import create_app; from tabula_rasa.http.alpha_documents import load_alpha_document_store; create_app(schema_only=True).openapi(); assert not {"streamlit", "gspread", "tabula_rasa.storage"}.intersection(sys.modules)''

        '
    - run: python -m playwright install --with-deps chromium firefox webkit
    - name: Run native browser concurrency and core workflow tests
      run: python -m pytest tests/postgres/test_browser_alpha.py tests/postgres/test_browser_baselines.py tests/postgres/test_browser_copy_recurring.py tests/postgres/test_browser_mileage_documents.py tests/postgres/test_browser_mileage_imports.py tests/postgres/test_browser_quality.py tests/postgres/test_browser_secondary.py tests/postgres/test_browser_transaction_bulk_copy.py tests/postgres/test_browser_transaction_imports.py tests/postgres/test_browser_workflow_ports.py tests/postgres/test_browser_workflows.py tests/postgres/test_identity_browser.py tests/postgres/test_workspace_browser.py -ra --durations=20 --junitxml=native-browser-results.xml
      env:
        TABULA_RASA_REQUIRE_BROWSER_TESTS: '1'
    - name: Upload combined reports and overlay proof
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: baseline-combined-results
        path: 'native-browser-results.xml

          web/test-results/

          baseline-overlay-proof.json'
        if-no-files-found: ignore
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: tabula_test
          POSTGRES_DB: tabula_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U tabula_test -d tabula_test" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TABULA_RASA_TEST_DATABASE_URL: postgresql+psycopg://tabula_test@127.0.0.1:5432/tabula_test
  evidence-status:
    name: Evidence pair status
    if: ${{ always() }}
    needs:
    - partitioned-python-suite
    - partitioned-windows-tooling
    - partitioned-frontend-contract
    - partitioned-browser
    - partitioned-native-browser
    - baseline-python-suite
    - baseline-windows-tooling
    - baseline-combined
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Require all evidence components
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: 'python - <<''PY''

        import json, os

        results = json.loads(os.environ[''RESULTS''])

        print(json.dumps(results, indent=2))

        assert all(job[''result''] == ''success'' for job in results.values())

        PY

        '
