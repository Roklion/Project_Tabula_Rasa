name: Support schema 0014 to 0015 maintenance
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [development, staging]
        required: true
      operation:
        type: choice
        options: [inspect, upgrade]
        default: inspect
        required: true
      image:
        description: Tested immutable image built from this exact main workflow revision
        type: string
        required: true
      approval:
        type: choice
        options: [not_approved, 0014_to_0015]
        default: not_approved
        required: true
      recovery_checkpoint_sha256:
        description: Private verified recovery-record SHA-256; required only for upgrade
        type: string
        required: false
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  maintenance:
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.environment == 'development' || inputs.environment == 'staging') &&
      (inputs.operation == 'inspect' || (inputs.operation == 'upgrade' && inputs.approval == '0014_to_0015')) &&
      vars.COMMERCIAL_DEPLOY_ENABLED == 'true'
    environment: ${{ inputs.environment }}
    concurrency:
      group: commercial-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ${{ inputs.image }}
      TABULA_RASA_ENVIRONMENT: ${{ inputs.environment }}
      TABULA_RASA_ACCESS_MODE: ${{ vars.TABULA_RASA_ACCESS_MODE }}
      TABULA_RASA_PUBLIC_ORIGIN: ${{ vars.TABULA_RASA_PUBLIC_ORIGIN }}
      TABULA_RASA_DEPLOY_DATABASE_SHA256: ${{ vars.TABULA_RASA_DEPLOY_DATABASE_SHA256 }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      MAINTENANCE_OPERATION: ${{ inputs.operation }}
      MAINTENANCE_APPROVAL: ${{ inputs.approval }}
      MAINTENANCE_RECOVERY_SHA256: ${{ inputs.recovery_checkpoint_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-postgres.txt
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact tested image and maintenance scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python -m tabula_rasa.deployment.support_maintenance preflight >> "$GITHUB_STEP_SUMMARY"
      - name: Bound inspection or approved forward upgrade
        env:
          TABULA_RASA_DATABASE_URL: ${{ secrets.TABULA_RASA_MIGRATION_DATABASE_URL }}
        run: |
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            -e GITHUB_REPOSITORY -e GITHUB_REF -e GITHUB_SHA -e IMAGE \
            -e TABULA_RASA_ENVIRONMENT -e TABULA_RASA_ACCESS_MODE \
            -e TABULA_RASA_PUBLIC_ORIGIN -e TABULA_RASA_DEPLOY_DATABASE_SHA256 \
            -e RENDER_SERVICE_ID -e MAINTENANCE_OPERATION -e MAINTENANCE_APPROVAL \
            -e MAINTENANCE_RECOVERY_SHA256 -e TABULA_RASA_DATABASE_URL \
            "$IMAGE" python -m tabula_rasa.deployment.support_maintenance execute >> "$GITHUB_STEP_SUMMARY"
