name: Repository CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-suite:
    name: Python suite (Linux + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: tabula_test
          POSTGRES_DB: tabula_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tabula_test -d tabula_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TABULA_RASA_TEST_DATABASE_URL: postgresql+psycopg://tabula_test@127.0.0.1:5432/tabula_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: ruff check .
      - name: Run complete Python suite
        run: python -m pytest -ra --junitxml=python-results.xml
      - name: Upload Python results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-results
          path: python-results.xml
          if-no-files-found: ignore

  windows-tooling:
    name: Windows environment setup
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Windows-only setup coverage
        run: python -m pytest tests/tooling/test_codex_environment_setup.py -ra --junitxml=windows-results.xml
      - name: Upload Windows results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-results
          path: windows-results.xml
          if-no-files-found: ignore

  browser:
    name: Browser and generated API contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: tabula_test
          POSTGRES_DB: tabula_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tabula_test -d tabula_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TABULA_RASA_TEST_DATABASE_URL: postgresql+psycopg://tabula_test@127.0.0.1:5432/tabula_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - run: npm --prefix web ci
      - run: python -m tabula_rasa.http.export_openapi --output contracts/http/openapi.json
      - run: npm --prefix web run api:generate
      - run: git diff --exit-code -- contracts/http/openapi.json web/src/api/schema.d.ts
      - run: npm --prefix web run build
      - run: npm --prefix web run lint
      - run: npm --prefix web test
      - run: npm --prefix web exec -- playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e
      - run: python -m playwright install --with-deps chromium
      - name: Run native browser concurrency tests
        run: python -m pytest tests/postgres/test_browser_baselines.py
        env:
          TABULA_RASA_REQUIRE_BROWSER_TESTS: '1'

  full-suite:
    name: Full test suite
    if: ${{ always() }}
    needs: [python-suite, windows-tooling, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every suite to succeed
        shell: bash
        env:
          PYTHON_RESULT: ${{ needs.python-suite.result }}
          WINDOWS_RESULT: ${{ needs.windows-tooling.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          echo "Python suite: $PYTHON_RESULT"
          echo "Windows setup: $WINDOWS_RESULT"
          echo "Browser suite: $BROWSER_RESULT"
          test "$PYTHON_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$BROWSER_RESULT" = success
