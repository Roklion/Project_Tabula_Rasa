name: Repository CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-suite:
    name: Python suite (Linux + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: tabula_test
          POSTGRES_DB: tabula_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tabula_test -d tabula_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TABULA_RASA_TEST_DATABASE_URL: postgresql+psycopg://tabula_test@127.0.0.1:5432/tabula_test
      TABULA_RASA_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build NAS backup client image
        run: docker build -f deploy/nas/Dockerfile -t tabula-nas-backup:test .
      - name: Verify synthetic NAS TLS backup and isolated restore
        run: >-
          docker run --rm --user postgres --entrypoint python3
          --mount type=bind,source=${{ github.workspace }}/tests/tooling/nas_backup_smoke.py,target=/smoke.py,readonly
          tabula-nas-backup:test /smoke.py
      - name: Lint Python
        run: ruff check .
      - name: Run complete Python suite
        run: python -m pytest -ra --durations=20 --junitxml=python-results.xml
      - name: Upload Python results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-results
          path: python-results.xml
          if-no-files-found: ignore

  windows-tooling:
    name: Windows environment setup
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Windows-only setup coverage
        run: python -m pytest tests/tooling/test_codex_environment_setup.py -ra --junitxml=windows-results.xml
      - name: Upload Windows results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-results
          path: windows-results.xml
          if-no-files-found: ignore

  frontend-contract:
    name: Frontend, contracts and runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: python -m tabula_rasa.http.export_openapi --output contracts/http/openapi.json
      - run: npm --prefix web run api:generate
      - run: git diff --exit-code -- contracts/http/openapi.json web/src/api/schema.d.ts
      - run: npm --prefix web run build
      - run: npm --prefix web run lint
      - run: npm --prefix web test
      - run: npm --prefix web run test:contracts
      - name: Build and inspect commercial runtime image (no runtime secrets)
        shell: bash
        run: |
          SCHEMA=$(python -c 'from tabula_rasa.infrastructure.postgres.migrations import head_revision; print(head_revision())')
          docker build --platform linux/amd64 --build-arg RELEASE_ID="$GITHUB_SHA" --build-arg SCHEMA_REVISION="$SCHEMA" -f deploy/commercial/Dockerfile -t tabula-commercial:ci .
          docker run --rm tabula-commercial:ci python -c 'import sys; from tabula_rasa.http.app import create_app; from tabula_rasa.http.alpha_documents import load_alpha_document_store; create_app(schema_only=True).openapi(); assert not {"streamlit", "gspread", "tabula_rasa.storage"}.intersection(sys.modules)'
      - name: Upload run-once contract results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-contract-results
          path: web/test-results/contracts/
          if-no-files-found: ignore

  browser:
    name: Browser UI (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web exec -- playwright install --with-deps chromium firefox webkit
      - run: npm --prefix web run test:browser -- --shard=${{ matrix.shard }}/2
      - name: Upload browser UI results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-${{ matrix.shard }}
          path: web/test-results/browser/
          if-no-files-found: ignore

  native-browser:
    name: Native browser (HTTP + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: tabula_test
          POSTGRES_DB: tabula_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tabula_test -d tabula_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TABULA_RASA_TEST_DATABASE_URL: postgresql+psycopg://tabula_test@127.0.0.1:5432/tabula_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: python -m playwright install --with-deps chromium firefox webkit
      - name: Run native browser concurrency and core workflow tests
        run: python -m pytest tests/postgres/test_browser_alpha.py tests/postgres/test_browser_baselines.py tests/postgres/test_browser_copy_recurring.py tests/postgres/test_browser_mileage_documents.py tests/postgres/test_browser_mileage_imports.py tests/postgres/test_browser_quality.py tests/postgres/test_browser_secondary.py tests/postgres/test_browser_transaction_bulk_copy.py tests/postgres/test_browser_transaction_imports.py tests/postgres/test_browser_workflow_ports.py tests/postgres/test_browser_workflows.py tests/postgres/test_identity_browser.py tests/postgres/test_workspace_browser.py -ra --durations=20 --junitxml=native-browser-results.xml
        env:
          TABULA_RASA_REQUIRE_BROWSER_TESTS: '1'
      - name: Upload native browser results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-browser-results
          path: |
            native-browser-results.xml
            web/test-results/
          if-no-files-found: ignore

  full-suite:
    name: Full test suite
    if: ${{ always() }}
    needs: [python-suite, windows-tooling, frontend-contract, browser, native-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every suite to succeed
        shell: bash
        env:
          PYTHON_RESULT: ${{ needs.python-suite.result }}
          WINDOWS_RESULT: ${{ needs.windows-tooling.result }}
          FRONTEND_RESULT: ${{ needs.frontend-contract.result }}
          NATIVE_RESULT: ${{ needs.native-browser.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          echo "Python suite: $PYTHON_RESULT"
          echo "Windows setup: $WINDOWS_RESULT"
          echo "Browser UI shards: $BROWSER_RESULT"
          echo "Frontend/contracts/image: $FRONTEND_RESULT"
          echo "Native browser: $NATIVE_RESULT"
          test "$PYTHON_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$NATIVE_RESULT" = success
