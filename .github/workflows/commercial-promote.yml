name: Commercial environment promotion
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  deploy:
    if: inputs.environment == 'development' || inputs.environment == 'staging'
    environment: ${{ inputs.environment }}
    concurrency:
      group: commercial-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ${{ inputs.image }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TABULA_RASA_ENVIRONMENT: ${{ inputs.environment }}
      TABULA_RASA_PUBLIC_ORIGIN: ${{ vars.TABULA_RASA_PUBLIC_ORIGIN }}
      TABULA_RASA_DEPLOY_DATABASE_SHA256: ${{ vars.TABULA_RASA_DEPLOY_DATABASE_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify tested main image and metadata
        run: python -m tabula_rasa.deployment.release verify --image "$IMAGE"
      - name: Explicit bound migration (separate credential and process)
        env:
          TABULA_RASA_DATABASE_URL: ${{ secrets.TABULA_RASA_MIGRATION_DATABASE_URL }}
        run: |
          docker run --rm \
            -e TABULA_RASA_DATABASE_URL -e TABULA_RASA_ENVIRONMENT \
            -e TABULA_RASA_DEPLOY_DATABASE_SHA256 \
            "$IMAGE" python -m tabula_rasa.deployment.database migrate
      - name: Install smoke browser
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Deploy, verify and recover prior compatible image on smoke failure
        env:
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          TABULA_RASA_ALPHA_USERNAME: ${{ secrets.TABULA_RASA_ALPHA_USERNAME }}
          TABULA_RASA_ALPHA_PASSWORD: ${{ secrets.TABULA_RASA_ALPHA_PASSWORD }}
        run: python -m tabula_rasa.deployment.release promote --image "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
