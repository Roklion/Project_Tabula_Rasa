name: Seed private commercial registry
on:
  push:
    branches: [codex/seed-private-commercial-registry]
permissions:
  packages: write
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE: ghcr.io/heathcote-advisory/project_tabula_rasa/commercial@sha256:bafbd50e788eafadaeacb4b9a68485a46a3f01edad189263d62e704ed02278ad
      DESTINATION: ghcr.io/heathcote-advisory/project_tabula_rasa/commercial-private:registry-seed-fb7daf15843b26456582afd53519bccf46a04a73
      EXPECTED_DIGEST: sha256:bafbd50e788eafadaeacb4b9a68485a46a3f01edad189263d62e704ed02278ad
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Seed and verify the one approved image
        shell: bash
        run: |
          if existing=$(docker buildx imagetools inspect "$DESTINATION" --format '{{.Manifest.Digest}}' 2>&1); then
            if [[ "$existing" != "$EXPECTED_DIGEST" ]]; then
              echo "Destination tag already contains a different image."
              exit 1
            fi
          elif [[ "$existing" == "ERROR: $DESTINATION: not found" ]]; then
            docker buildx imagetools create --tag "$DESTINATION" "$SOURCE"
          else
            echo "Destination availability could not be verified."
            exit 1
          fi
          actual=$(docker buildx imagetools inspect "$DESTINATION" --format '{{.Manifest.Digest}}')
          test "$actual" = "$EXPECTED_DIGEST"
          printf 'Verified seed digest %s\n' "$actual"
      - name: Verify anonymous access is denied
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          package, tag = os.environ["DESTINATION"].removeprefix("ghcr.io/").rsplit(":", 1)
          params = urlencode({"service": "ghcr.io", "scope": f"repository:{package}:pull"})
          try:
              with urlopen(f"https://ghcr.io/token?{params}", timeout=15) as response:
                  token = json.load(response)["token"]
              request = Request(f"https://ghcr.io/v2/{package}/manifests/{tag}", method="HEAD", headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.oci.image.index.v1+json",
              })
              with urlopen(request, timeout=15):
                  raise SystemExit("Seed manifest is anonymously accessible.")
          except HTTPError as error:
              if error.code not in {401, 403}:
                  raise SystemExit(f"Anonymous access could not be verified (HTTP {error.code}).") from None
              print(f"Anonymous access denied (HTTP {error.code}).")
          PY
