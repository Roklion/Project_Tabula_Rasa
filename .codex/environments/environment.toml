# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "local"

[setup]
script = ""

[setup.win32]
script = '''
$venvPython = Join-Path (Get-Location).Path ".venv\Scripts\python.exe"

function Test-Python312 {
    param(
        [Parameter(Mandatory = $true)]
        [string]$Executable,
        [string[]]$Arguments = @()
    )

    if (-not (Test-Path -LiteralPath $Executable -PathType Leaf)) {
        return $false
    }

    & $Executable @Arguments -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)" 2>$null
    return $LASTEXITCODE -eq 0
}

if (-not (Test-Path -LiteralPath $venvPython -PathType Leaf)) {
    $candidates = @(
        @{ Path = (Join-Path $env:ProgramFiles "Python312\python.exe"); Args = @() },
        @{ Path = (Join-Path $env:PUBLIC "Python312\python.exe"); Args = @() }
    )

    $launcher = Get-Command py.exe -ErrorAction SilentlyContinue
    if ($null -ne $launcher) {
        $candidates += @{ Path = $launcher.Source; Args = @("-3.12") }
    }

    $python = Get-Command python.exe -ErrorAction SilentlyContinue
    if ($null -ne $python) {
        $candidates += @{ Path = $python.Source; Args = @() }
    }

    $selected = $null
    foreach ($candidate in $candidates) {
        if (Test-Python312 -Executable $candidate.Path -Arguments $candidate.Args) {
            $selected = $candidate
            break
        }
    }

    if ($null -eq $selected) {
        throw "A sandbox-readable Python 3.12 interpreter is required to create .venv."
    }

    & $selected.Path @($selected.Args) -m venv .venv
    if ($LASTEXITCODE -ne 0) {
        throw "Failed to create .venv."
    }
}

& $venvPython -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
if ($LASTEXITCODE -ne 0) {
    throw "The existing .venv must use Python 3.12. Remove or rename it, then run setup again."
}

& $venvPython -m pip install --disable-pip-version-check -r requirements-dev.txt
if ($LASTEXITCODE -ne 0) {
    throw "Failed to install requirements-dev.txt."
}

& $venvPython -m pip install --disable-pip-version-check "playwright==1.62.0"
if ($LASTEXITCODE -ne 0) {
    throw "Failed to install Playwright."
}

$env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:PUBLIC "ms-playwright"
& $venvPython -m playwright install chromium
if ($LASTEXITCODE -ne 0) {
    throw "Failed to install Playwright Chromium."
}
'''
